<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Fintech Dashboard</title>
    <!-- Uso la misma tipografía limpia que elegí para mi dashboard -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Vinculo mi nuevo archivo CSS exclusivo para darle estilo a esta pantalla -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    


    <div class="login-container">
        
        <div class="login-card">
            
            <!-- El encabezado de mi Login -->
            <div class="login-header">
                
                <h2>Hola! Bienvenido de vuelta</h2>
                <h3>BankLine</h3>
                <p>Ingresa tu correo y contraseña para entrar a tu banca en linea.</p>
            </div>
            
            <!-- Mi formulario donde atraparé los datos del usuario -->
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="fer@ejemplo.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <!-- Aquí inyectaré los mensajes de error desde mi JavaScript si la contraseña está mal (lo dejo oculto por defecto) -->
                <div id="error-message" class="error-message" style="display: none;"></div>
                
                <button type="submit" class="login-btn">Iniciar Sesión</button>
            </form>

        </div>
    </div>

    <!-- Vinculo el archivo de lógica JavaScript que crearé después para conectar con mi API de Python -->
    <script src="js\login.js"></script>
</body>
</html>
