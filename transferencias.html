<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencias - Fintech Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"> 
    <link rel="stylesheet" href="css/transferencias.css"> 
</head>
<body>

   <!-- Menú de navegación superior -->
    <header class="navbar">
        <div class="logo">BankLine Cells</div>
        <nav>
            <ul>
                <a href="index.html" class="active">Inicio</a>
                <a href="transferencias.html">Transferencias</a>
                <li><a href="#">Tarjetas</a></li>
            </ul>
        </nav>
       
         <div class="navbar-right">
            <div class="user-actions">
                
                <button id="logout-btn" class="logout-btn">Cerrar Sesión</button>
            </div>
        </div>
    </header>

       
   

    <!-- CONTENEDOR PRINCIPAL DE TRANSFERENCIAS -->
    <div class="transfer-container">
        
        <!-- Tarjeta del Formulario -->
        <div class="transfer-card">
            <h2>Enviar Dinero</h2>
            <p>Ingresa los datos del destinatario para realizar un SPEI.</p>

            <form id="transfer-form">
                
                <div class="input-group">
                    <label for="clabe">Cuenta CLABE (18 dígitos)</label>
                    <input type="text" id="clabe" placeholder="Ej. 012345678901234567" maxlength="18" required>
                    <small id="banco-detectado" style="color: #10b981; font-weight: 600; display: block; margin-top: 5px; height: 18px;"></small
                </div>
                
                <div class="input-group">
                    <label for="amount">Monto a transferir (MXN)</label>
                    <input type="number" id="amount" placeholder="0.00" min="1" step="0.01" required>
                </div>

                <div class="input-group">
                    <label for="concept">Concepto de pago</label>
                    <input type="text" id="concept" placeholder="Ej. Pago de renta" maxlength="50" required>
                </div>

                <!-- Caja para mostrar errores (saldo insuficiente, etc.) -->
                <div id="transfer-error" class="error-message" style="display: none;"></div>
                
                <!-- Caja para mostrar éxito -->
                <div id="transfer-success" class="success-message" style="display: none;"></div>

                <button type="submit" class="transfer-btn" id="submit-transfer-btn">Transferir ahora</button>
            </form>
            
        </div>
            
        
       
    </div>
    <script src="js/tema.js"></script>
    <script src="js\trasnferencias.js"></script>
</body>
</html>
