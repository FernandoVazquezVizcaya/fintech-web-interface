<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fintech Dashboard | Gestión Financiera</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Menú de navegación superior -->
    <header class="navbar">
        <div class="logo">BankLine Cells</div>
        <nav>
            <ul>
                <a href="index.html" class="active">Inicio</a>
                <a href="transferencias.html">Transferencias</a>
                <li><a href="#">Tarjetas</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <div class="user-profile" id="user-greeting">Cargando...</div>
            <button id="logout-btn" class="logout-btn">Cerrar Sesión</button>
        </div>
    </header>

    <!-- Contenedor principal del Dashboard -->
    <main class="dashboard-container">
        <!-- Agrego un indicador de carga mientras espero a mi API -->
        <div id="loader" style="text-align: center; grid-column: 1 / -1; font-size: 1.5rem; color: #072146; padding: 3rem;">
            <strong>Cargando tu información financiera...</strong>
        </div>
        <!-- Sección Izquierda: Saldo y Tarjetas -->
        <section class="account-summary">
            <div class="balance-card">
                <h2>Saldo Disponible</h2>
                <h1 id="current-balance">$0.00</h1>
            </div>

            <div class="credit-cards">
                <h3>Mis Tarjetas</h3>
                <!-- Aquí inyecto tarjetas dinámicamente con JS -->
                <div id="cards-container"></div>
            </div>
        </section>

        <!-- Sección Derecha: Historial de Movimientos -->
        <section class="transactions">
            <h3>Últimos Movimientos</h3>
            <table class="transactions-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>Monto</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="transactions-body">
                    <!-- Las filas se llenarán consumiendo la API -->
                </tbody>
            </table>
        </section>

    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
